name: Release Jack
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v0.1.0)
        required: true
permissions:
  contents: write
concurrency:
  group: jack-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: desktop
      - run: node tools/verify-release.mjs
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: node --test tools/live-volume.test.mjs tools/application-groups.test.mjs
        working-directory: desktop
      - run: pwsh -NoProfile -File tools/verify-gg-setup.ps1
      - run: node tools/collect-licenses.mjs --check
      - name: Build signed installer and draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Jack ${{ env.RELEASE_TAG }}
          releaseBody: 'Windows 11 x64용 Jack 배포 후보입니다. SteelSeries GG / Sonar Classic이 필요합니다. 설치·업데이트의 실제 PC 확인은 진행 중입니다. 설치 조건과 제한은 README를 참고하세요.'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --bundles nsis
      - name: Verify built installer signature and tamper rejection
        shell: pwsh
        run: |
          $version = (Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $installer = Get-Item "target/release/bundle/nsis/Jack_${version}_x64-setup.exe"
          cargo run -p jack-desktop --example verify-update -- $installer.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
