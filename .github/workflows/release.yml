name: Release Jack
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v0.1.0)
        required: true
permissions:
  contents: write
concurrency:
  group: jack-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
      - run: npm ci
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - run: node tools/verify-release.mjs
      - run: node tools/verify-release.mjs --preflight
      - run: node --test tools/verify-release.test.mjs
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: npm test
        working-directory: desktop
      - run: pwsh -NoProfile -File tools/verify-gg-setup.ps1
      - run: node tools/collect-licenses.mjs --check
      - name: Read release notes
        id: notes
        shell: pwsh
        run: |
          $notes = Get-Content docs/release-notes.md -Raw
          @('body<<JACK_RELEASE_NOTES', $notes, 'JACK_RELEASE_NOTES') | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Build signed installer and draft release
        id: build
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ env.RELEASE_TAG }}
          # The existing tag fixes the build; main avoids workflow-write scope checks
          # when another commit is pushed while a tagged release is building.
          releaseCommitish: main
          releaseName: Jack ${{ env.RELEASE_TAG }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis -- --locked
      - name: Verify uploaded draft assets with existing app keys
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $assets = Join-Path $env:RUNNER_TEMP 'jack-draft-assets'
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $assets --pattern '*.exe' --pattern '*.sig' --pattern latest.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/verify-release.mjs --draft $assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish verified release as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --notes-file docs/release-notes.md --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify public update endpoint without authentication
        shell: pwsh
        run: |
          $assets = Join-Path $env:RUNNER_TEMP 'jack-public-assets'
          for ($attempt = 1; $attempt -le 6; $attempt++) {
            node tools/verify-release.mjs --published $assets
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 6) { Start-Sleep -Seconds 10 }
          }
          exit 1
