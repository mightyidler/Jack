[workspace]
members = ["crates/jack-core", "crates/jack-engine", "crates/jack-windows-audio", "crates/jack-sonar", "tools/jack-audio-probe", "desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.7"
edition = "2024"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
windows = { version = "0.62.2", features = ["Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_WinRT", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_Foundation"] }
